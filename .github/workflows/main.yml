name: Build Android 2D Football APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Gradle 8.7 & Generate Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Initialize ./gradlew Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. Upload Ready-to-Install APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SepakBola-2D-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
